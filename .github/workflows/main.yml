name: TikTok News Bot

on:
  schedule:
    # يشتغل مرة واحدة كل أسبوع (يوم الأحد الساعة 12 منتصف الليل بتوقيت UTC)
    - cron: '0 0 * * 0' 
  workflow_dispatch:
    inputs:
      news_url:
        description: 'رابط خبر محدد (اختياري - اتركه فارغاً إذا كنت تستخدم مصدر)'
        required: false
        default: ''
      source_url:
        description: 'رابط مصدر/قسم (اختياري - اتركه فارغاً إذا كنت تستخدم خبر محدد)'
        required: false
        default: ''
      privacy_level:
        description: 'مستوى الخصوصية'
        required: true
        default: 'SELF_ONLY'
        type: choice
        options:
          - SELF_ONLY
          - MUTUAL_FOLLOW_FRIENDS
          - PUBLIC_TO_EVERYONE
      keyword:
        description: 'فلتر بكلمة مفتاحية (اكتب الكلمة هنا، أو اتركها فارغة لعدم الفلترة)'
        required: false
        default: ''
      enable_audio:
        description: 'إضافة موسيقى خلفية؟'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      caption_prefix:
        description: 'جملة تظهر أول الكابشن'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - 'عاجل: '
          - 'خبر اليوم: '
          - 'تطورات جديدة: '
          - 'عاجل جداً: '

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_URL: ${{ github.event.inputs.news_url }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          PRIVACY_LEVEL: ${{ github.event.inputs.privacy_level }}
          KEYWORD_FILTER: ${{ github.event.inputs.keyword }}
          ENABLE_AUDIO: ${{ github.event.inputs.enable_audio }}
          CAPTION_PREFIX: ${{ github.event.inputs.caption_prefix }}
        run: python bot.py

      - name: Commit and push history and pointer
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_history.txt source_pointer.txt
          git commit -m "Update history and pointer" || echo "No changes to commit"
          git push
