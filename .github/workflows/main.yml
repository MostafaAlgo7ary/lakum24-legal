name: TikTok News Bot

on:
  schedule:
    - cron: '0 */12 * * *' # يشتغل مرتين يومياً
  workflow_dispatch:
    inputs:
      news_url:
        description: 'رابط خبر محدد (اختياري - ينشر الخبر ده فوراً)'
        required: false
        default: ''
      source_url:
        description: 'رابط مصدر/قسم (اختياري - يختار أحدث خبر فيه)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_URL: ${{ github.event.inputs.news_url }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: python bot.py

      - name: Commit and push history and pointer
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted_history.txt source_pointer.txt
          git commit -m "Update history and pointer" || echo "No changes to commit"
          git push
