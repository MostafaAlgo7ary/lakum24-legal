name: Get TikTok Refresh Token
on: workflow_dispatch
jobs:
  exchange-code:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests

      - name: Exchange Code via Python
        env:
          CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          AUTH_CODE: 'qBlnKs9niRIr9Dz-Zls3VjCG98ggg6D8IBwlifTfA3dOm0s4a9477ImiqacNdiAXsoWOJhcRTSRRyYAG4S0aBROeu9M59gDnTMo5bkpuft1GwwTeOn5qnRhaQYxsl7vevcj_DA4rE-t-t-QXhy3srSf0hllleFjwXEW8EWzdSbWOTINjKpSIveR1uOOhbvUvHy2239JGq1AtQO3fTwvjn5ETAtrDdki6vx--_xoKjd1qxeM-dnWoJaJpQJS0jomHulIt4nvfxy-vnopS*!4940.e1'
        run: |
          python -c "
          import requests, os
          url = 'https://open.tiktokapis.com/v2/oauth/token/'
          payload = {
              'client_key': os.environ['CLIENT_KEY'],
              'client_secret': os.environ['CLIENT_SECRET'],
              'code': os.environ['AUTH_CODE'],
              'grant_type': 'authorization_code',
              'redirect_uri': 'https://mostafaalgo7ary.github.io/lakum24-legal/callback.html'
          }
          headers = {'Content-Type': 'application/x-www-form-urlencoded'}
          r = requests.post(url, data=payload, headers=headers)
          print(r.text)
          "
