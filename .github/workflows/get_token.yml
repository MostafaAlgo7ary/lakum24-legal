name: Get TikTok Refresh Token
on: workflow_dispatch
jobs:
  exchange-code:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Exchange Code via Python
        env:
          CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          python -c "
          import requests, os
          url = 'https://open.tiktokapis.com/v2/oauth/token/'
          payload = {
              'client_key': os.environ['CLIENT_KEY'],
              'client_secret': os.environ['CLIENT_SECRET'],
              'code': 'E50DNRxwYEpGFRcj9NpZ5MQ1JHdMn72OsBukk50lDoqyRHenrmP2qRPK4zpBgdcessruz2Zb884BcyTqfP2q_VP9l-cHPUGIsBy37Cxh4wTN8IsRUc2vezUirdt1TuJ1LaBYTB4lrSqy3kxbAaP3E2SqHInMrq9K7ArdIhHgRIaexhJiqsjHnnymrawrcFAR8jPGMjefBNiwsONeytvz-BH8KQrBfoGcoB4up8jfM0JNrB7oQ4QMQqts9zZfRH3MIDRVT0AD-7TOtgvQ*!4884.e1',
              'grant_type': 'authorization_code',
              'redirect_uri': 'https://mostafaalgo7ary.github.io/lakum24-legal/callback.html'
          }
          headers = {'Content-Type': 'application/x-www-form-urlencoded'}
          r = requests.post(url, data=payload, headers=headers)
          print(r.text)
          "
