name: Get TikTok Refresh Token
on: workflow_dispatch
jobs:
  exchange-code:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange Code
        run: |
          curl -X POST 'https://open.tiktokapis.com/v2/oauth/token/' \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          -d 'client_key=${{ secrets.TIKTOK_CLIENT_KEY }}' \
          -d 'client_secret=${{ secrets.TIKTOK_CLIENT_SECRET }}' \
          -d 'code=XtbUwOmGot7fHS3uuZcm1x740h0A4L13EQzGEsegtiubbx02u3yahPtINu4V93-luCDUV-1wyBmcD1lBYMVzS6ycNN2eqQAeFPxwnCIc_Tae6KN04D0Ygtdp70TrAQSQhiBTQiMdiIqaSQOTz4DHgor3MSHcnsS76mtSH34dJNgKmipbwLvblTJ0j-iH9L4g-8lwclASLZJAUGsS_Fft9cBUnNbebDz8OoKQYrMoogv-j4XLW8cag4CSlnSq00bRH-6pPWVEKQ8gc5yY*!4864.e1' \
          -d 'grant_type=authorization_code' \
          -d 'redirect_uri=https://mostafaalgo7ary.github.io/lakum24-legal/callback.html'
